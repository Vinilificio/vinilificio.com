<!DOCTYPE html>
<html lang="{{ page.lang }}">

{% include head.html %}

<body class="{{ page.lang }}">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MCNGJC6" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    {% include header.html %}

    <div class="sidebar jsSidebar">
        <h3 class="sidebar__main-title">{{ page.title }}</h3>
        {% if page.menu %}
        <ul class="menu vertical">
            {% for menuItem in page.menu %}
            <li class="sidebar__item"><a href="#{{menuItem.id}}" class="sidebar__link jsSidebarLink">{{ menuItem.titolo }}</a></li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>

    <div class="main jsMain">
        <div class="jsMainAnchor"></div>
        <div class="main__content jsMainContent">
            {{ content }}
        </div>
    </div>

    {% include footer.html %}

    <script type="text/javascript" src="//cdn.jsdelivr.net/jquery.slick/1.6.0/slick.min.js"></script>
    <script type="text/javascript">
        $(document).ready(function(){
          $('.slideshow').slick();
        });
    </script>
<a href="https://www.iubenda.com/privacy-policy/84748550" class="iubenda-black iubenda-noiframe iubenda-embed" title="Privacy Policy ">Privacy Policy</a><script type="text/javascript">(function (w,d) {var loader = function () {var s = d.createElement("script"), tag = d.getElementsByTagName("script")[0]; s.src="https://cdn.iubenda.com/iubenda.js"; tag.parentNode.insertBefore(s,tag);}; if(w.addEventListener){w.addEventListener("load", loader, false);}else if(w.attachEvent){w.attachEvent("onload", loader);}else{w.onload = loader;}})(window, document);</script>

</body>

</html>
